name: sport_manager
description: This is an application that allows you to add sports data in the Health application for tennis and dance (Test only on iOS).

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.5.1+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  health: ^13.3.2
  google_fonts: ^9.0.0
  ionicons: ^0.2.3
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  lottie: ^3.6.1
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.8.1
  geolocator: ^14.1.1
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  rxdart: ^0.28.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  ios: true
  image_path_ios: "assets/icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/audio/
    - assets/lottie/

