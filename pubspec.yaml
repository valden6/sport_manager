name: sport_manager
description: This is an application that allows you to add sports data in the Health application for tennis and dance (Test only on iOS).

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  health: ^10.0.2
  google_fonts: ^6.2.1
  ionicons: ^0.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  lottie: ^3.1.2
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.0.0
  geolocator: ^12.0.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.1
  flutter_native_timezone_updated_gradle: ^2.0.3
  timezone: ^0.9.4
  rxdart: ^0.28.0
  flutter_app_badger: ^1.5.0
  flutter_iconly: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  rename: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  ios: true
  image_path_ios: "assets/icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/audio/

